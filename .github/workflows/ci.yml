name: CI

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # No secret needed: vite.config.ts gives the tests their own fake VITE_API_URL
      - run: npm test

      # tsc -b, then vite build: type errors anywhere in src/ fail here
      - run: npm run build
